name: ci

on:
  push:
  pull_request:

jobs:
  mock:
    name: mock-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure + build
        run: ./build.sh mock ${{ matrix.build_type }}

      - name: Tests (ASan/UBSan в Debug, LTO в Release)
        run: ctest --test-dir .build/mock --output-on-failure

  target-plan:
    name: target-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check target matrix
        run: python3 tools/target_plan.py --check

  stm32-phase2:
    name: ${{ matrix.target }}-phase2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [stm32f4, stm32g4]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure + build Phase 2 self-test
        run: ./build.sh ${{ matrix.target }} Release

      - name: Verify Phase 2/3 images
        run: |
          test -f .build/${{ matrix.target }}/firmware/phase2/phase2_fw.elf
          test -f .build/${{ matrix.target }}/firmware/phase3/phase3_fw.elf
          grep -q "MCFRAME_PHASE0_STUB:BOOL=OFF" .build/${{ matrix.target }}/CMakeCache.txt
          arm-none-eabi-size .build/${{ matrix.target }}/firmware/phase2/phase2_fw.elf
          arm-none-eabi-size .build/${{ matrix.target }}/firmware/phase3/phase3_fw.elf

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASan/UBSan host tests
        run: |
          cmake -S . -B .build/san -DMCU_TARGET=mock -DCMAKE_BUILD_TYPE=Debug -DMCFRAME_SANITIZE=ON
          cmake --build .build/san -j2
          ctest --test-dir .build/san --output-on-failure

  esp32c3-idf:
    name: esp32c3-idf-build
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        run: |
          cd firmware/esp32c3
          idf.py set-target esp32c3
          idf.py build

  esp32c3-project:
    name: esp32c3-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static ESP-IDF project checks
        run: python3 firmware/esp32c3/tools/check_project.py

      - name: mcflash protocol tests
        run: cd tools && python3 -m unittest -q test_mcflash.py

  esp32c3-stub:
    name: esp32c3-stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C3 target plan
        run: python3 tools/target_plan.py --target esp32c3

      - name: Configure + build Phase 0 stub
        run: ./build.sh esp32c3 Release

      - name: Verify stub registration
        run: |
          test -f .build/esp32c3/CMakeCache.txt
          grep -q "MCFRAME_PHASE0_STUB:BOOL=ON" .build/esp32c3/CMakeCache.txt
          grep -q "MCFRAME_KERNEL:STRING=freertos" .build/esp32c3/CMakeCache.txt

  stm32:
    name: stm32-cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Flat image
        run: ./build.sh stm32 Release

      - name: "Size budget (flat: вся Flash 128 КБ)"
        run: |
          tools/check_size.sh .build/stm32/bootloader_fw.bin 20480 "bootloader"
          tools/check_size.sh .build/stm32/example_fw.bin 131072 "example flat"
          arm-none-eabi-size .build/stm32/example/example_fw

      - name: Flat + shell image
        run: |
          rm -rf .build/stm32
          ./build.sh stm32 Release -DMCFRAME_APP_SHELL=ON

      - name: Size budget (flat + shell)
        run: |
          tools/check_size.sh .build/stm32/example_fw.bin 131072 "example flat+shell"

      - name: Slot image
        run: |
          rm -rf .build/stm32
          ./build.sh stm32 Release -DMCFRAME_IMAGE=slot

      - name: "Size budget (slot: 52 КБ + загрузчик 20 КБ)"
        run: |
          tools/check_size.sh .build/stm32/bootloader_fw.bin 20480 "bootloader"
          tools/check_size.sh .build/stm32/example_fw.bin 53248 "example slot"
          arm-none-eabi-size .build/stm32/example/example_fw

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-slot-firmware
          path: |
            .build/stm32/bootloader_fw.bin
            .build/stm32/bootloader_fw.hex
            .build/stm32/example_fw.bin
            .build/stm32/example_fw.hex
